; BioForge - which SeverActions bio blocks an NPC gets.
;
; Needs SeverActions with its Bio Blocks API v4. BioForge applies only KEYED
; blocks - the ones SeverActions ships (severause.severactions:*) and any other
; mod's - and never one the player has deleted or removed the pack of.
;
; GROUPS. Each [section] is one group: at most one block from it per NPC, and
; the group is skipped entirely when the NPC already shows a block in any of its
; `tabs` (the player's choice always stands).
;
;   tabs     = Tab, Tab        SeverActions tabs that mean "this group is decided"
;   chance   = 0-100           % chance the flavour roll lands
;   intimate = true            opt-in (blocks.intimate), never for a child, and
;                              rolls on blocks.intimateChance instead of `chance`
;   unless   = cond cond       skip the whole group when ANY of these holds
;
; ENTRIES.
;   fact    = <key> when cond cond ...
;       Follows from game data. The first fact that holds fills the group, and
;       the LLM is never offered it as a choice. A fact takes no weight.
;   flavour = <key> [weight N] [when cond ...] [unless cond ...] [rarely cond ...] [evidence w, w]
;       Weighted roll. For a NEW bio the roll is only the default: the group is
;       offered to the generating model as a menu, and it may pick another
;       entry when the NPC's own evidence points there. For an EXISTING bio
;       (Add blocks, no LLM call) the `evidence` words are matched, whole-word,
;       against that bio, and a match decides the group.
;       `rarely` keeps an unlikely pairing possible: when any of its conditions
;       holds the weight drops to 1 instead of the entry being ruled out - the
;       odd cowardly guard. `unless` rules an entry out; it is kept for child
;       safety only. The same key may appear on several lines (a leaning by
;       race and by faction); their weights add up.
;       weight 0 = evidence-only: never rolled at random, still on the menu.
;
; WEIGHTS used below, so the odds read at a glance:
;   20 strong leaning   10 common   5 uncommon   2 rare   1 very rare
;
; CONDITIONS (all `when` must hold; any `unless` / `rarely` triggers):
;   faction(Plugin.esm|FormID)   runtime membership
;   voice(Plugin.esm|FormID)     voice type
;   race(Prefix)                 race editor ID prefix: race(Nord) matches
;                                NordRace and NordRaceVampire
;   keyword(EditorID)            on the NPC record or its race
;   child  adult  male  female
;   skill(Restoration>=50)       base actor value
;
; A form from a plugin that is not loaded simply never holds.
; Edit freely; BioForge.log reports any line it could not read.
;
; Factions referenced below (Skyrim.esm unless noted):
;   0B3292 Vigilants of Stendarr     02BF9B Stormcloaks       02BF9A Imperial Legion
;   039F26 Thalmor                   01BDB3 Dark Brotherhood  029DA9 Thieves Guild
;   0FF234 the Circle                048362 Companions        086EEE guards
;   05159A priests                   0C139A House of Arkay    045F66 Hall of the Dead
;   Dawnguard.esm|014217 Dawnguard   voice 013AD4 MaleDrunk


