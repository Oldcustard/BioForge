chance = 6
fact    = severause.severactions:cognitive.child                  when child
flavour = severause.severactions:cognitive.uneducated             weight 10 unless child evidence illiterate, never learned to read, unschooled
flavour = severause.severactions:cognitive.below-average          weight 5  unless child evidence slow-witted, dim-witted, simple-minded
flavour = severause.severactions:cognitive.illusory-superiority   weight 5  unless child evidence know-it-all, insufferable, condescending
flavour = severause.severactions:cognitive.very-low               weight 1  unless child
; cognitive.teenager is deliberately absent: it describes a minor's mind, and
; on an adult NPC it could sit beside intimate blocks.


