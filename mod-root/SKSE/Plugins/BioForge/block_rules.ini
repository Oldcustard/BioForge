; BioForge - which SeverActions bio blocks an NPC gets.
;
; Needs SeverActions with its Bio Blocks API v4. BioForge applies only KEYED
; blocks - the ones SeverActions ships (severause.severactions:*) and any other
; mod's - and never one the player has deleted or removed the pack of.
;
; HOW A BLOCK IS CHOSEN.
;   1. Facts follow from game data and always apply.
;   2. Flavour is ROLLED: each group lands on its `chance`, then one entry is
;      picked by weight. Groups roll independently and there is no cap - an
;      NPC who lands every roll gets a block from every group.
;   3. A model reviews the rolls against the NPC's evidence - inside the bio's
;      own generation, or in a small call of its own (Review blocks) for an
;      NPC who already has a bio. It keeps a roll unless the evidence
;      contradicts it (then replaces or drops it), and adds an entry from a
;      group that did not roll only when the evidence names it outright.
;   Nothing is applied until you commit.
;
; GROUPS. Each [section] is one group: at most one block from it per NPC, and
; the group is skipped entirely when the NPC already shows a block in any of its
; `tabs` (the player's choice always stands).
;
;   tabs     = Tab, Tab        SeverActions tabs that mean "this group is decided"
;   chance   = 0-100           % chance the flavour roll lands - the one knob for
;                              how OFTEN a group appears (weights only decide
;                              what it lands on)
;   intimate = true            opt-in (blocks.intimate), never for a child. Its
;                              `chance` SCALES blocks.intimateChance instead of
;                              replacing it: chance = 50 with the setting at 30%
;                              lands 15% of the time. Unset means 100.
;   unless   = cond cond       skip the whole group when ANY of these holds
;
; ENTRIES.
;   fact    = <key> when cond cond ...
;       The first fact that holds fills the group. A fact takes no weight.
;   flavour = <key> [weight N] [pool NAME] [when cond ...] [unless cond ...] [rarely cond ...]
;       `when`   all must hold for the entry to be in the roll at all
;       `rarely` when any holds, the entry is a tenth as likely - the odd
;                cowardly guard. Prefer it to `unless`: everything should stay
;                reachable, however small the chance.
;       `unless` rules the entry out. Kept for child safety only.
;       The same key may appear on several lines (a leaning by race and by
;       faction); their weights add up. weight 0 is never rolled, but stays on
;       the list the model may add from.
;
; POOLS. A set of rare options can share a fixed slice of its group instead of
; being weighed one by one:
;   pool    = <name> <percent>      in the group: that percent of the group's
;                                   ROLLS goes to the pool's members together
;   flavour = <key> pool <name>     a member; its `weight` (default 1) splits
;                                   the pool's slice between members
; The pool is the base level for the set as a whole: 19 Daedric Princes share
; one slice, so adding a Prince does not make Daedra worship more common.
; Another line for the same key outside the pool adds on top - Orcs still lean
; to Malacath. Being a share of the group's rolls, an intimate pool follows the
; intimate dial like the rest of its group.
;
; WEIGHTS are relative within a group. The scale used below:
;   1000 dominant   500 strong leaning   100 common   50 uncommon   10 rare   1 very rare
; tools/block_odds.py prints the resulting odds for any kind of NPC - tune
; with it rather than in the game.
;
; CONDITIONS:
;   faction(Plugin.esm|FormID)   runtime membership
;   voice(Plugin.esm|FormID)     voice type
;   race(Prefix)                 race editor ID prefix: race(Nord) matches
;                                NordRace and NordRaceVampire
;   keyword(EditorID)            on the NPC record or its race
;   child  adult  male  female
;   skill(Restoration>=50)       base actor value
;
; A form from a plugin that is not loaded simply never holds.
; Edit freely; BioForge.log reports any line it could not read.
;
; Factions referenced below (Skyrim.esm unless noted):
;   0B3292 Vigilants of Stendarr     02BF9B Stormcloaks       02BF9A Imperial Legion
;   039F26 Thalmor                   01BDB3 Dark Brotherhood  029DA9 Thieves Guild
;   0FF234 the Circle                048362 Companions        086EEE guards
;   05159A priests                   0C139A House of Arkay    045F66 Hall of the Dead
;   Dawnguard.esm|014217 Dawnguard   voice 013AD4 MaleDrunk



