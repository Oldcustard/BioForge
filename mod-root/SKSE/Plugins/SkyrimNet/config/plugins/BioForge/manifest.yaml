# Bio Forge — SkyrimNet plugin manifest.
#
# SkyrimNet auto-discovers plugin folders under
# `Data/SKSE/Plugins/SkyrimNet/config/plugins/<plugin>/` and ingests this file.
#
#   `schema.fields:` declares the settings SkyrimNet shows in its in-game UI.
#   The `path:` values here are exactly what the DLL reads through
#   PublicGetPluginConfigValue("BioForge", <path>, <default>) — keep them in
#   sync with Config.cpp.
#
# NOTE: deliberately no `variants:` block. Bio Forge dispatches on SkyrimNet's
# own `CharacterProfileGeneration` variant — the one already configured for
# writing character profiles — so the user picks a model in one place instead of
# configuring a second, near-identical profile for us. It also inherits that
# variant's tuning (full model, 10k max_tokens, temperature 0.7); a plugin's own
# fresh variant inherits the dialogue defaults instead, which are a flash model
# on a 4k cap. Bio Forge never handles an API key either way.

plugin:
  name: BioForge
  version: "0.1.0"
  description: "Writes SkyrimNet character bios for mod-added NPCs that have none, from the characterisation their own mod already authored — dialogue, factions, outfit, location."

schema:
  fields:
    # ---- Scan scope -------------------------------------------------------
    # No hotkey setting: the UI is a page in SKSE Menu Framework's mod control
    # panel, opened with SMF's own global toggle key. A per-mod hotkey would be
    # one more binding to collide with - and SkyrimNet's Hotkey.yaml already uses
    # VIRTUAL-KEY codes while CommonLibSSE reports DirectInput scan codes, so two
    # hotkey settings side by side would disagree about what "F10" means.
    # Scope follows where you are standing. Indoors a scan covers your whole
    # current cell (no radius - the cell is enumerated directly), so the only
    # knob is for outdoors, where a scan crosses cells and the radius IS the
    # scope: a town-wide sweep.
    - name: "Exterior Scan Radius"
      path: "scan.exteriorRadius"
      type: "float"
      description: "Radius in game units for a scan taken outdoors, which crosses cell boundaries. One exterior cell is 4096 units, so a town-wide sweep wants several thousand more - but a larger radius outdoors can be a lot of people."
      defaultValue: 10000.0
      min: 100.0
      max: 40000.0
      category: "Scan"

    - name: "Unique NPCs Only"
      path: "scan.uniqueOnly"
      type: "bool"
      description: "Only consider NPCs flagged Unique. Generic leveled actors (bandits, guards, drunks) share base records and are served correctly by SkyrimNet's generic fallback template, so writing them individual bios is wasted effort. Turning this off also makes the reported race unreliable, because a leveled actor's editor base is a template shell with placeholder traits."
      defaultValue: true
      category: "Scan"

    - name: "Include Dead"
      path: "scan.includeDead"
      type: "bool"
      description: "Include dead actors in the scan."
      defaultValue: false
      category: "Scan"

    # ---- Generation --------------------------------------------------------
    - name: "Concurrent Generations"
      path: "generate.maxConcurrent"
      type: "int"
      description: "How many bios may be generated at once when running a batch. Each one is a full LLM request, so raising this speeds a large batch up but is also the quickest way to hit a provider's rate limit. Four is a good default for a hosted endpoint; lower it to 1 or 2 if yours is strict about rate limits, raise it if you are running a local model."
      defaultValue: 4
      min: 1
      max: 8
      category: "Generation"

    - name: "Refine Ties After A Batch"
      path: "generate.refinePass"
      type: "bool"
      description: "After a batch finishes, re-ask for the relationships section of any bio that was written while the people around it still had no profile. Those bios could only note that their neighbours were present; this rewrites their ties now that the neighbours exist. One small extra call per affected NPC, and only for ones that actually gained a written neighbour - nothing else in the bio is touched, and a failed refine leaves the original exactly as it was."
      defaultValue: true
      category: "Generation"

    # ---- Regional digest ---------------------------------------------------
    # A short reference sheet of who holds power, trade and property in one
    # settlement, written once by the LLM and reused by every bio generated
    # there. It exists because the mechanical signals that would connect an NPC
    # to the wider world - proper nouns in their dialogue, shared factions,
    # world knowledge - are all empty for a typical mod-added NPC.
    - name: "Use Regional Digests"
      path: "digest.enabled"
      type: "bool"
      description: "Give each bio a short reference sheet of who matters in the settlement it is written in, so relationships can name real local people and institutions instead of falling back on 'the customers' and 'the locals'. The sheet is written once per settlement and reused, so it costs one extra generation per town rather than one per NPC. Off means every bio is written from that NPC's own evidence alone."
      defaultValue: true
      category: "Regional digest"

    - name: "Build Digest Before A Batch"
      path: "digest.autoBuild"
      type: "bool"
      description: "When you run a batch in a settlement that has no digest yet, build one first and hold the batch until it lands. Off generates the batch immediately without one. This only affects batches - generating a single NPC never spends an extra call building a digest, it just uses one if it is already there."
      defaultValue: true
      category: "Regional digest"

    - name: "Bios Harvested Per Digest"
      path: "digest.maxCandidates"
      type: "int"
      description: "How many of your installed character bios to offer the digest as evidence about who actually lives in a settlement. This is the one large block in that prompt, so it is capped. Bios naming the settlement come first; if too few do, the rest is topped up from the surrounding hold."
      defaultValue: 120
      min: 20
      max: 400
      category: "Regional digest"
